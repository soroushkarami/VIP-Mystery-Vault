<!DOCTYPE html>
<html>
<head>
    <title>تخفیف‌های شما – Mystery Deal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center mb-4">🎁 تخفیف‌های ویژه</h2>
    <p class="text-center text-muted">{{ customer.phone }}</p>

    <div class="row g-3">
        <div class="col-12 col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <div class="display-1">🎁</div>
                    <h5 class="mt-3">محصول</h5>
                    <p class="text-muted">سایز</p>
                    <p class="price">تومان</p>
                    <!-- ❌ No discount reveal button -->
                </div>
            </div>
        </div>
        <!-- Repeat for 3 cards, all with no discount -->
    </div>

    <div class="text-center mt-4">
        <p class="text-muted">برای مشاهده تخفیف‌های خود، لطفاً با پشتیبانی تماس بگیرید.</p>
    </div>
</div>
</body>
</html>
