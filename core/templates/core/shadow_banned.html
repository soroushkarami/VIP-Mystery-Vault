<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <title>تخفیف‌های شما | Mystery Deal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: radial-gradient(circle at 30% 20%, #1a1a2e, #16213e);
            min-height: 100vh;
            font-family: 'Vazirmatn', 'IRANSans', 'Tahoma', sans-serif;
            padding: 20px;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px !important;
            min-height: 280px;
            overflow: hidden;
        }
        .glass-card .card-body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1.5rem 1rem;
        }
        .page-title {
            color: #fff;
            font-weight: 700;
            font-size: 1.8rem;
        }
        .page-subtitle {
            color: rgba(255,255,255,0.3);
            font-size: 0.9rem;
        }
        .customer-phone {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            background: rgba(255,255,255,0.05);
            padding: 4px 16px;
            border-radius: 50px;
            display: inline-block;
        }
        .placeholder-icon {
            font-size: 4rem;
            opacity: 0.2;
        }
        .product-name-fake {
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            font-size: 1rem;
            margin-top: 0.75rem;
        }
        .product-size-fake {
            color: rgba(255,255,255,0.15);
            font-size: 0.85rem;
        }
        .price-fake {
            color: rgba(255,255,255,0.2);
            font-weight: 700;
            font-size: 1.1rem;
        }
        .footer-text {
            color: rgba(255,255,255,0.2);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="main-container">

    <div class="text-center mb-4">
        <h2 class="page-title">🎁 تخفیف‌های ویژه</h2>
        <p class="page-subtitle">برای مشاهده تخفیف‌ها، لطفاً با پشتیبانی تماس بگیرید</p>
        <span class="customer-phone"><i class="bi bi-phone me-1"></i> {{ customer.phone }}</span>
    </div>

    <div class="row g-3">
        <div class="col-12 col-md-4">
            <div class="card glass-card shadow">
                <div class="card-body text-center">
                    <div class="placeholder-icon">🎁</div>
                    <h5 class="product-name-fake">محصول</h5>
                    <p class="product-size-fake">سایز</p>
                    <p class="price-fake">تومان</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card glass-card shadow">
                <div class="card-body text-center">
                    <div class="placeholder-icon">🎁</div>
                    <h5 class="product-name-fake">محصول</h5>
                    <p class="product-size-fake">سایز</p>
                    <p class="price-fake">تومان</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card glass-card shadow">
                <div class="card-body text-center">
                    <div class="placeholder-icon">🎁</div>
                    <h5 class="product-name-fake">محصول</h5>
                    <p class="product-size-fake">سایز</p>
                    <p class="price-fake">تومان</p>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <p class="footer-text">
            <i class="bi bi-info-circle me-1"></i>
            برای مشاهده تخفیف‌های خود، لطفاً با پشتیبانی تماس بگیرید.
        </p>
    </div>

</div>
</body>
</html>
