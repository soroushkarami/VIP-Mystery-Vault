<!DOCTYPE html>
<html>
<head>
    <title>Mystery Deal – Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>🏪 {{ store.name }}</h1>
        <a href="{% url 'logout' %}" class="btn btn-outline-danger">Logout</a>
    </div>

    <div class="row g-3">
        <div class="col-12 col-md-6">
            <div class="card text-center">
                <div class="card-body">
                    <h2 class="display-4">{{ pending_deals }}</h2>
                    <p class="card-text">Pending Deals</p>
                    <a href="{% url 'pending_deals' %}" class="btn btn-primary">View Deals</a>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6">
            <div class="card text-center">
                <div class="card-body">
                    <h2 class="display-4">{{ store.markup_percent }}%</h2>
                    <p class="card-text">Markup</p>
                    <a href="{% url 'product_list' %}" class="btn btn-secondary">Manage Products</a>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a href="{% url 'upload_inventory' %}" class="btn btn-success w-100">📤 Upload New Inventory</a>
    </div>
</div>
</body>
</html>
