<!DOCTYPE html>
<html>
<head>
    <title>صبر کنید – Mystery Deal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div class="container mt-5">
    <div class="card text-center shadow" style="max-width: 500px; margin: 50px auto;">
        <div class="card-body">
            <div class="display-1">⏳</div>
            <h3 class="mt-3">صبر کنید!</h3>
            {% if message %}
                <p>{{ message }}</p>
            {% else %}
                <p>شما چندین بار بازدید کرده‌اید بدون خرید.</p>
            {% endif %}
            <p class="text-muted">
                تا تاریخ <strong>{{ cooldown_until|date:"Y/m/d" }}</strong>
                تخفیف جدیدی دریافت نخواهید کرد.
            </p>
            <p class="text-muted">بعد از این تاریخ دوباره برگردید تا تخفیف ویژه دریافت کنید.</p>
        </div>
    </div>
</div>
</body>
</html>
