<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <title>صبر کنید – Mystery Deal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: radial-gradient(circle at 30% 20%, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', 'IRANSans', 'Tahoma', sans-serif;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            padding: 2.5rem 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            transition: 0.3s;
        }
        .glass-card:hover {
            border-color: rgba(251, 191, 36, 0.15);
        }
        .icon-big {
            font-size: 4.5rem;
            color: #fbbf24;
            display: block;
            margin-bottom: 0.5rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .title {
            color: #fff;
            font-weight: 700;
            font-size: 1.8rem;
            margin-top: 0.5rem;
        }
        .message-text {
            color: rgba(255,255,255,0.6);
            font-size: 1.05rem;
            margin: 0.75rem 0;
        }
        .info-box {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 20px;
            margin: 16px 0;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .info-box strong {
            color: #fbbf24;
        }
        .info-box .date {
            color: #fff;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .divider {
            border-color: rgba(255,255,255,0.06);
            margin: 1.25rem 0;
        }
        .note {
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
        }
        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none;
            border-radius: 50px;
            padding: 12px 32px;
            font-weight: 600;
            color: #1a1a2e;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-gold:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.3);
            color: #1a1a2e;
        }
        .btn-gold i {
            margin-left: 8px;
        }
        .sub-text {
            color: rgba(255,255,255,0.2);
            font-size: 0.75rem;
            margin-top: 1.25rem;
        }
    </style>
</head>
<body>
<div class="glass-card">
    <span class="icon-big"><i class="bi bi-hourglass-split"></i></span>

    <h2 class="title">⏳ !صبر کنید</h2>
    <p class="message-text">{{ message|default:"شما امروز تخفیف‌های خود را دریافت کرده‌اید." }}</p>

    <div class="info-box">
        <p style="margin: 0; color: rgba(255,255,255,0.5); font-size: 0.9rem;">
            <i class="bi bi-calendar-event me-2"></i> تخفیف‌های جدید از تاریخ:
        </p>
        <p class="date">{{ next_available|date:"Y/m/d H:i" }}</p>
        <p style="margin: 0; color: rgba(255,255,255,0.3); font-size: 0.8rem;">
            در دسترس خواهند بود
        </p>
    </div>

    <hr class="divider">

    <p class="note">
        <i class="bi bi-clock-history me-1"></i>
        هر ۲۴ ساعت یک بار می‌توانید تخفیف‌های جدید دریافت کنید.
    </p>

    <a href="javascript:history.back()" class="btn-gold mt-3">
        <i class="bi bi-arrow-right"></i> بازگشت
    </a>

    <p class="sub-text">
        <i class="bi bi-shield-check me-1"></i> اطلاعات شما محفوظ است
    </p>
</div>
</body>
</html>
