<!DOCTYPE html>
<html>
<head>
    <title>صبر کنید – Mystery Deal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #f5f5f5; }
        .card { max-width: 500px; margin: 50px auto; }
        .timer { font-size: 2rem; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow text-center">
        <div class="card-body">
            <div class="display-1">⏳</div>
            <h3 class="mt-3">صبر کنید!</h3>
            <p>{{ message }}</p>
            <p class="text-muted">
                تخفیف‌های جدید از تاریخ:
                <strong>{{ next_available|date:"Y/m/d H:i" }}</strong>
                در دسترس خواهند بود.
            </p>
            <hr>
            <p class="text-muted small">
                هر ۲۴ ساعت یک بار می‌توانید تخفیف‌های جدید دریافت کنید.
            </p>
            <a href="javascript:history.back()" class="btn btn-primary mt-3">بازگشت</a>
        </div>
    </div>
</div>
</body>
</html>
