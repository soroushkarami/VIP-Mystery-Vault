<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <title>خطا | Mystery Deal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: radial-gradient(circle at 30% 20%, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', 'IRANSans', 'Tahoma', sans-serif;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            padding: 2.5rem 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .icon-big {
            font-size: 5rem;
            color: #fbbf24;
            display: block;
            margin-bottom: 0.5rem;
        }
        .title {
            color: #fff;
            font-weight: 700;
            font-size: 1.8rem;
            margin-top: 0.5rem;
        }
        .error-text {
            color: #f87171;
            font-size: 1rem;
            margin: 0.75rem 0;
        }
        .message-text {
            color: rgba(255,255,255,0.5);
            font-size: 0.95rem;
        }
        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none;
            border-radius: 50px;
            padding: 12px 40px;
            font-weight: 600;
            color: #1a1a2e;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-gold:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.3);
            color: #1a1a2e;
        }
        .divider {
            border-color: rgba(255,255,255,0.06);
            margin: 1.25rem 0;
        }
        .sub-text {
            color: rgba(255,255,255,0.2);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="glass-card">
    <span class="icon-big"><i class="bi bi-emoji-frown"></i></span>

    <h2 class="title">متأسفیم! 😕</h2>
    <p class="error-text">{{ error|default:"خطایی رخ داده است." }}</p>
    <p class="message-text">لطفاً دوباره امتحان کنید یا با پشتیبانی تماس بگیرید.</p>

    <hr class="divider">

    <a href="javascript:history.back()" class="btn-gold">
        <i class="bi bi-arrow-right me-2"></i> بازگشت
    </a>

    <p class="sub-text mt-3">
        <i class="bi bi-shield-check me-1"></i> در صورت نیاز با ۰۹۰۴۴۰۴۹۵۱۴ تماس بگیرید
    </p>
</div>
</body>
</html>
