<!DOCTYPE html>
<html>
<head>
    <title>اشتراک منقضی – Mystery Deal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card text-center shadow" style="max-width: 500px; margin: 50px auto;">
        <div class="card-body">
            <div class="display-1">⛔</div>
            <h3 class="mt-3">اشتراک شما منقضی شد!</h3>
            <p class="text-muted">{{ message|default:"برای تمدید اشتراک، لطفاً با پشتیبانی تماس بگیرید." }}</p>
            <p class="text-muted small">
                در صورت نیاز به تمدید، با شماره ... تماس بگیرید.
            </p>
            <a href="{% url 'logout' %}" class="btn btn-primary">خروج</a>
        </div>
    </div>
</div>
</body>
</html>
