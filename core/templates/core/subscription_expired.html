<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <title>اشتراک منقضی | Mystery Deal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: radial-gradient(circle at 30% 20%, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', 'IRANSans', 'Tahoma', sans-serif;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            padding: 2.5rem 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .icon-big {
            font-size: 5rem;
            color: #f87171;
            display: block;
            margin-bottom: 0.5rem;
        }
        .title {
            color: #fff;
            font-weight: 700;
            font-size: 1.8rem;
            margin-top: 0.5rem;
        }
        .message-text {
            color: rgba(255,255,255,0.6);
            font-size: 1.05rem;
            margin: 0.75rem 0;
        }
        .sub-text {
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
        }
        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none;
            border-radius: 50px;
            padding: 12px 40px;
            font-weight: 600;
            color: #1a1a2e;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-gold:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.3);
            color: #1a1a2e;
        }
        .divider {
            border-color: rgba(255,255,255,0.06);
            margin: 1.25rem 0;
        }
    </style>
</head>
<body>
<div class="glass-card">
    <span class="icon-big"><i class="bi bi-shield-exclamation"></i></span>

    <h2 class="title">⛔ اشتراک منقضی شد!</h2>
    <p class="message-text">{{ message|default:"برای تمدید اشتراک، لطفاً با پشتیبانی تماس بگیرید." }}</p>

    <hr class="divider">

    <p class="sub-text">
        <i class="bi bi-telephone me-1"></i>
        در صورت نیاز به تمدید، با شماره ۰۹۰۴۴۰۴۹۵۱۴ تماس بگیرید.
    </p>

    <a href="{% url 'logout' %}" class="btn-gold mt-3">
        <i class="bi bi-box-arrow-left me-2"></i> خروج
    </a>
</div>
</body>
</html>
