<!DOCTYPE html>
<html>
<head>
    <title>Upload Logo – Mystery Deal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>📸 Store Logo</h1>
        <a href="{% url 'account_settings' %}" class="btn btn-outline-secondary">← Back</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    {% if store.logo %}
                        <img src="{{ store.logo.url }}" class="img-fluid rounded mb-3" style="max-height: 150px; max-width: 150px;">
                        <p class="text-muted">Current logo</p>
                    {% else %}
                        <div class="display-1 mb-3">🏪</div>
                        <p class="text-muted">No logo uploaded yet.</p>
                    {% endif %}

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100">Upload Logo</button>
                    </form>
                    <small class="text-muted d-block mt-2">
                        Recommended: Square image, max 400x400px.
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
