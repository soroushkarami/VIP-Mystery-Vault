<!DOCTYPE html>
<html>
<head>
    <title>Account Settings – Mystery Deal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>🔐 Account Settings</h1>
        <a href="{% url 'dashboard_home' %}" class="btn btn-outline-secondary">← Dashboard</a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <div class="row g-4">
        <!-- Change Username -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">✏️ Change Username</h5>
                    <p class="card-text">Current: <strong>{{ request.user.username }}</strong></p>
                    <a href="{% url 'change_username' %}" class="btn btn-primary">Change Username</a>
                </div>
            </div>
        </div>
        <!-- Change Password -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">🔑 Change Password</h5>
                    <p class="card-text">Update your password for security.</p>
                    <a href="{% url 'password_change' %}" class="btn btn-warning">Change Password</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
