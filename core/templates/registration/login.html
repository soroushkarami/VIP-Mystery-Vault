<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <title>ورود | Mystery Deal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            transition: 0.3s;
        }
        .brand-icon {
            font-size: 3.2rem;
            color: #fbbf24;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.25);
        }
        .form-control {
            background: rgba(255,255,255,0.07) !important;
            border: 1px solid rgba(255,255,255,0.12) !important;
            color: #fff !important;
            border-radius: 50px !important;
            padding: 12px 20px !important;
        }
        .form-control:focus {
            border-color: #fbbf24 !important;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15) !important;
            background: rgba(255,255,255,0.1) !important;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.35);
        }
        .form-label {
            color: rgba(255,255,255,0.7);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: 600;
            color: #1a1a2e;
            transition: 0.3s;
            width: 100%;
            font-size: 1rem;
        }
        .btn-gold:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.35);
            color: #1a1a2e;
        }
        .text-glow {
            color: #fff;
            text-shadow: 0 2px 10px rgba(255,255,255,0.05);
        }
        .brand-sub {
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .alert-danger {
            background: rgba(248, 113, 113, 0.12) !important;
            border: 1px solid rgba(248, 113, 113, 0.2) !important;
            color: #fca5a5 !important;
            border-radius: 50px !important;
            padding: 10px 20px !important;
            text-align: center;
        }
        .text-muted-custom {
            color: rgba(255,255,255,0.25);
            font-size: 0.8rem;
        }
        .input-group-text-custom {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            border-radius: 50px 0 0 50px !important;
            color: rgba(255,255,255,0.4) !important;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="text-center mb-4">
            <div class="brand-icon"><i class="bi bi-gem"></i></div>
            <h2 class="text-white mt-2 fw-bold" style="letter-spacing: 1px;">Mystery Deal</h2>
            <p class="brand-sub">ورود به پنل فروشنده</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">نام کاربری</label>
                <input type="text" name="username" id="id_username" class="form-control" placeholder="نام کاربری خود را وارد کنید" required>
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label">رمز عبور</label>
                <input type="password" name="password" id="id_password" class="form-control" placeholder="رمز عبور خود را وارد کنید" required>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> نام کاربری یا رمز عبور اشتباه است
                </div>
            {% endif %}

            <button type="submit" class="btn-gold mt-2">
                <i class="bi bi-box-arrow-in-right me-2"></i> ورود به پنل
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted-custom">
                <i class="bi bi-shield-check me-1"></i> اتصال ایمن
            </p>
        </div>
    </div>
</body>
</html>
